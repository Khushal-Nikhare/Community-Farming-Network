<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Farm2Home - Login & Signup</title>
  <style>
    /* Add animations and transitions */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 500px;
      text-align: center;
      animation: fadeIn 0.5s ease-out;
      transition: all 0.3s ease;
    }
    .container:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(76, 175, 80, 0.2);
    }
    h2 {
      margin-bottom: 1rem;
      animation: fadeIn 0.5s ease-out;
      position: relative;
    }
    h2::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 3px;
      background: #4CAF50;
      transition: width 0.3s ease;
    }
    .container:hover h2::after {
      width: 100px;
    }
    .form-group {
      margin-bottom: 1rem;
      text-align: left;
      animation: fadeIn 0.5s ease-out;
      animation-fill-mode: both;
    }
    #login-form .form-group:nth-child(1) { animation-delay: 0.1s; }
    #login-form .form-group:nth-child(2) { animation-delay: 0.2s; }
    #step1 .form-group:nth-child(1) { animation-delay: 0.1s; }
    #step1 .form-group:nth-child(2) { animation-delay: 0.2s; }
    #step1 .form-group:nth-child(3) { animation-delay: 0.3s; }
    #step2 .form-group:nth-child(1) { animation-delay: 0.1s; }
    #step2 .form-group:nth-child(2) { animation-delay: 0.2s; }
    #step2 .form-group:nth-child(3) { animation-delay: 0.3s; }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }
    input, select {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #4CAF50;
      box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.2);
      transform: scale(1.01);
    }
    button {
      padding: 0.75rem;
      background: #4CAF50;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 10px;
      width: 100%;
      transition: all 0.3s ease;
      animation: fadeIn 0.5s ease-out;
      animation-delay: 0.4s;
      animation-fill-mode: both;
    }
    button:hover {
      background: #388E3C;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
    }
    .hidden {
      display: none;
      opacity: 0;
      transform: translateX(-20px);
    }
    .toggle-button {
      background: none;
      border: none;
      color: #4CAF50;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 10px;
      transition: all 0.3s ease;
    }
    .toggle-button:hover {
      color: #388E3C;
      transform: scale(1.05);
      background: none;
      box-shadow: none;
    }
    form {
      transition: all 0.3s ease;
    }
    form:not(.hidden) {
      animation: fadeIn 0.5s ease-out;
    }
    /* Add loading animation */
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .loading {
      position: relative;
      pointer-events: none;
    }
    .loading::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      top: 50%;
      left: 50%;
      margin-left: -10px;
      margin-top: -10px;
      border: 2px solid #fff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: rotate 0.8s linear infinite;
    }
    /* Success animation */
    @keyframes checkmark {
      0% { transform: scale(0); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    .success-checkmark {
      color: #4CAF50;
      font-size: 48px;
      animation: checkmark 0.5s ease-out;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="form-title">Login</h2>

    <!-- Login Form -->
    <form id="login-form">
      <div class="form-group">
        <label for="login-gmail">Gmail:</label>
        <input type="email" id="login-gmail" name="login-gmail" placeholder="example@gmail.com" required>
      </div>
      <div class="form-group">
        <label for="login-password">Password:</label>
        <input type="password" id="login-password" name="login-password" placeholder="Enter your password" required>
      </div>
      <button type="submit">Login</button>
      <p>Don't have an account? <button type="button" class="toggle-button" onclick="toggleForm()">Signup</button></p>
    </form>

    <!-- Signup Form - Step 1 -->
    <form id="step1" class="hidden">
      <div class="form-group">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
      </div>
      <div class="form-group">
        <label for="gender">Gender:</label>
        <select id="gender" name="gender" required>
          <option value="">Select Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>
      </div>
      <button type="button" onclick="nextStep(1)">Next</button>
      <p>Already have an account? <button type="button" class="toggle-button" onclick="toggleForm()">Login</button></p>
    </form>

    <!-- Signup Form - Step 2 -->
    <form id="step2" class="hidden">
      <div class="form-group">
        <label for="gmail">Gmail:</label>
        <input type="email" id="gmail" name="gmail" placeholder="example@gmail.com" required>
      </div>
      <div class="form-group">
        <label for="password">Create Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>
      <div class="form-group">
        <label for="confirm-password">Confirm Password:</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter password" required>
      </div>
      <button type="button" onclick="prevStep(2)">Back</button>
      <button type="submit">Signup</button>
    </form>
  </div>

  <script>
    function nextStep(currentStep) {
      document.getElementById("step" + currentStep).classList.add("hidden");
      document.getElementById("step" + (currentStep + 1)).classList.remove("hidden");
    }
  
    function prevStep(currentStep) {
      document.getElementById("step" + currentStep).classList.add("hidden");
      document.getElementById("step" + (currentStep - 1)).classList.remove("hidden");
    }
  
    function toggleForm() {
      const loginForm = document.getElementById("login-form");
      const signupForm = document.getElementById("step1");
      const title = document.getElementById("form-title");
  
      if (loginForm.classList.contains("hidden")) {
        // Show login form
        loginForm.classList.remove("hidden");
        signupForm.classList.add("hidden");
        document.getElementById("step2").classList.add("hidden");
        title.textContent = "Login";
      } else {
        // Show signup form
        loginForm.classList.add("hidden");
        signupForm.classList.remove("hidden");
        title.textContent = "Signup";
      }
    }
  
    document.getElementById("step2").addEventListener("submit", function (e) {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm-password").value;
  
      if (password !== confirmPassword) {
        alert("Passwords do not match! Please try again.");
      } else {
        alert("Signup successful!");
        window.location.href = "index.html";
      }
    });
  
    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      alert("Login successful!");
      window.location.href = "index.html";
    });
  </script>
  
</body>
</html>
